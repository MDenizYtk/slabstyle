# Coolify (Hetzner / Oracle) kurulumu — "Docker Compose" build pack ile bu dosya seçilir.
#
# VİTRİN MODU (varsayılan): yalnızca uygulama + PostgreSQL çalışır.
# Sunucuda yaklaşık 350 MB imaj ve 250 MB bellek kullanır; Redis ve worker gerekmez.
#
# TAM MAĞAZA moduna geçmek istediğinde:
#   1) STORE_MODE=shop yap
#   2) aşağıdaki "redis" ve "worker" servislerinin yorumunu kaldır
#   3) web'e REDIS_URL=redis://redis:6379 ekle
#
# SERVICE_PASSWORD_POSTGRES Coolify tarafından otomatik üretilir; diğer ${...}
# değerleri Coolify → Environment Variables ekranından girilir (docs/DEPLOY.md).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: slabstyle
      POSTGRES_USER: slabstyle
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - slabstyle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slabstyle -d slabstyle"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://slabstyle:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/slabstyle?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://slabstyle:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/slabstyle?schema=public
      APP_URL: ${APP_URL}
      STORE_MODE: ${STORE_MODE:-showcase}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-1}
      # Tam mağaza modunda: REDIS_URL, PAYMENT_PROVIDER, PAYMENT_WEBHOOK_SECRET, ALLOW_MOCK_PAYMENTS
    volumes:
      - slabstyle-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- TAM MAĞAZA MODU (vitrin modunda gerekmez) ---
