# Tek sunucuda üretim kurulumu. Değişkenler .env.production dosyasından okunur
# (şablon: .env.example). Önünde TLS sonlandıran bir ters vekil (Caddy, Nginx,
# Coolify/Traefik) olmalıdır; web servisi yalnızca iç ağda 3000 portunu açar.
#
#   docker compose --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: slabstyle
      POSTGRES_USER: ${POSTGRES_USER:-slabstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slabstyle} -d slabstyle"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-slabstyle}:${POSTGRES_PASSWORD}@postgres:5432/slabstyle?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-slabstyle}:${POSTGRES_PASSWORD}@postgres:5432/slabstyle?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_INLINE: "0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-slabstyle}:${POSTGRES_PASSWORD}@postgres:5432/slabstyle?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
